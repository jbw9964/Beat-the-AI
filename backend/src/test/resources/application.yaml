#file: noinspection SpellCheckingInspection
spring:
  application.name: backend
  threads.virtual.enabled: true
  modulith.detection-strategy: explicitly-annotated

  profiles:
    default: test-local
    group:
      test-local:
        - test-secret
        - directory-secret

      test-github-ci:
        - test-secret
        - github-ci-directory-secret

  ai:
    openai:
      api-key: ${api-key.openai}

  datasource:
    url: jdbc:h2:mem:test

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        globally_quoted_identifiers: true

  data:
    redis:
      host: localhost
      port: 6379

mdc-key:
  request-id: request-id
  thread-id: thread-id

soft-delete:
  hours-to-schedule-removal: 72

reward-image:
  base-directory: "${directory.backed-data}/reward-image"
  temporal-saving-abs-location: "${reward-image.base-directory}/temp"
  server-storing-abs-location: "${reward-image.base-directory}/storage"

logging:
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSz,Asia/Seoul
