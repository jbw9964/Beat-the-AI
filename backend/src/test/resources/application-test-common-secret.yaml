common-secret:
  jwt:
    access-token:
      signature: this-is-the-signature-for-testing-access-token
      expiration: 120     # 2 min
    refresh-token:
      signature: this-is-the-signature-for-testing-refresh-token
      expiration: 240     # 4 min

  multipart-info:
    max-file-size: 1MB
    max-request-size: 4MB

  api-key:
    openai: this-is-the-api-key-for-openai-request
